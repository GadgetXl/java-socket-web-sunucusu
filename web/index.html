<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Öğrenci Biyografisi</title>
    <style>
        :root {
            color: #17272b;
            background: #f2f5f2;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        main {
            box-sizing: border-box;
            width: min(42rem, calc(100% - 2rem));
            padding: clamp(1.5rem, 6vw, 4rem);
            background: #ffffff;
            border: 1px solid #d2ddd9;
            border-top: 5px solid #176255;
            border-radius: 0.75rem;
            box-shadow: 0 18px 55px #173a3012;
        }

        h1 {
            margin: 0;
            font: 700 clamp(2.4rem, 7vw, 4rem) / 1.05 Georgia, serif;
            overflow-wrap: anywhere;
        }

        h2 {
            margin: 0.85rem 0 0;
            color: #176255;
            font-size: clamp(1.1rem, 4vw, 1.35rem);
        }

        p {
            margin: 1.6rem 0 0;
            padding-top: 1.6rem;
            border-top: 1px solid #d2ddd9;
            color: #354746;
            font-size: 1.06rem;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main>
        <!-- Teslimden önce bu üç alanı kendi bilgilerinizle güncelleyin. -->
        <h1>Ad Soyad</h1>
        <h2>Öğrenci No 000000000</h2>
        <p>Merhaba, ben [Ad Soyad]. [Bölüm] öğrencisiyim. [İlgi alanlarınızdan ve
            üzerinde çalıştığınız bir konudan iki kısa cümleyle söz edin.]</p>
    </main>
</body>
</html>
